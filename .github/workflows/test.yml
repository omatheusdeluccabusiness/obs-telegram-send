name: Test macOS plugin

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and test (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install build tools
        run: brew install cmake ninja qtbase simde

      - name: Download OBS Studio 32.1.1 for Apple Silicon
        env:
          OBS_VERSION: 32.1.1
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/obsproject/obs-studio/releases/download/${OBS_VERSION}/OBS-Studio-${OBS_VERSION}-macOS-Apple.dmg" \
            --output "$RUNNER_TEMP/obs.dmg"
          hdiutil attach "$RUNNER_TEMP/obs.dmg" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/obs-mount"
          cp -R "$RUNNER_TEMP/obs-mount/OBS.app" "$RUNNER_TEMP/OBS.app"
          hdiutil detach "$RUNNER_TEMP/obs-mount"

      - name: Fetch OBS 32.1.1 headers
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/obsproject/obs-studio.git "$RUNNER_TEMP/obs-source"
          git -C "$RUNNER_TEMP/obs-source" checkout --detach 7272af1375b38bc3cf4e0f98a5d999e8b76e9309

      - name: Test Rust agent
        run: cargo test --manifest-path agent/Cargo.toml

      - name: Configure, build, and test plugin
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja \
            -DOBS_APP_BUNDLE="$RUNNER_TEMP/OBS.app" \
            -DOBS_INCLUDE_DIR="$RUNNER_TEMP/obs-source/libobs" \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build --config Release
          ctest --test-dir build --output-on-failure
