name: Test Windows agent

on:
  pull_request:
    paths:
      - 'agent/**'
      - 'plugin/**'
      - 'cmake/windows/**'
      - 'installer/windows/**'
      - 'scripts/**'
      - '.github/workflows/windows-agent.yml'
  push:
    branches:
      - main
    paths:
      - 'agent/**'
      - 'plugin/**'
      - 'cmake/windows/**'
      - 'installer/windows/**'
      - 'scripts/**'
      - '.github/workflows/windows-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-agent:
    name: Build and test agent (Windows x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Test Rust agent on the target platform
        shell: pwsh
        run: |
          cargo test --manifest-path agent/Cargo.toml
          cargo clippy --manifest-path agent/Cargo.toml --all-targets -- -D warnings
          cargo build --manifest-path agent/Cargo.toml --release

      - name: Build OBS plugin against pinned Windows dependencies
        shell: pwsh
        run: |
          cmake -S . -B build-windows -G 'Visual Studio 17 2022' -A x64 -DBUILD_TESTING=OFF
          cmake --build build-windows --config Release --parallel
          if (-not (Test-Path 'build-windows/plugin/Release/obs-telegram-send.dll')) {
            throw 'The Windows OBS plugin DLL was not created.'
          }

      - name: Build pinned local Telegram Bot API server
        shell: pwsh
        run: |
          ./scripts/build-telegram-bot-api-windows.ps1 `
            -WorkDirectory "$env:RUNNER_TEMP\telegram-bot-api-build" `
            -Output 'build-windows/telegram-bot-api.exe'

      - name: Assemble and verify Codex installation bundle
        shell: pwsh
        run: |
          ./scripts/build-windows-bundle.ps1 `
            -Plugin 'build-windows/plugin/Release/obs-telegram-send.dll' `
            -Agent 'agent/target/release/obs-telegram-agent.exe' `
            -TelegramBotApi 'build-windows/telegram-bot-api.exe' `
            -Output 'dist/OBS-Telegram-Send-Windows-x64-Codex.zip'
          ./scripts/verify-windows-bundle.ps1 -Bundle 'dist/OBS-Telegram-Send-Windows-x64-Codex.zip'

      - name: Upload Windows Codex bundle candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: OBS-Telegram-Send-Windows-x64-Codex
          path: dist/OBS-Telegram-Send-Windows-x64-Codex.zip
          if-no-files-found: error
          retention-days: 14
