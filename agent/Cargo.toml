[package]
name = "obs-telegram-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "obs-telegram-agent"
path = "src/main.rs"

[dependencies]
axum = "0.7"
directories-next = "2"
keyring = { version = "3", features = ["apple-native"] }
rand = "0.8"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
